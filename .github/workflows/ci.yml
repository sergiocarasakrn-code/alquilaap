name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alquilaap
          POSTGRES_PASSWORD: alquilaap
          POSTGRES_DB: alquilaap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alquilaap" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alquilaap:alquilaap@localhost:5432/alquilaap_test
      TEST_DATABASE_URL: postgresql://alquilaap:alquilaap@localhost:5432/alquilaap_test
      ID_HASH_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run test:db
      - run: npm run build
