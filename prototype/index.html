<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alquilaap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: marketplace shell. Top bar on desktop, bottom tab bar on phone; tag-yellow marks paid visibility. */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --surface-2:#eceee7; --line:#dadcd3;
  --ink:#16201e; --ink-2:#4c5753; --ink-3:#7c8682;
  --brand:#0f6b5c; --brand-ink:#ffffff; --brand-soft:#d9ece7;
  --tag:#f3c536; --tag-ink:#2a2105; --tag-soft:#fbefc2;
  --ok:#2f8a4c; --warn:#b26b00; --bad:#c2412d; --ok-soft:#dcf0e2; --warn-soft:#f8e8cc; --bad-soft:#f7dcd6;
  --shadow:0 1px 2px rgba(22,32,30,.06),0 6px 20px rgba(22,32,30,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#172020; --surface-2:#1f2a29; --line:#2c3836;
  --ink:#e8eeec; --ink-2:#b2bdb9; --ink-3:#7f8b87;
  --brand:#3fb39c; --brand-ink:#06201a; --brand-soft:#173a33;
  --tag:#f3c536; --tag-ink:#2a2105; --tag-soft:#3a3214;
  --ok:#5cc47c; --warn:#e2a24a; --bad:#ef7a66; --ok-soft:#183324; --warn-soft:#3a2c14; --bad-soft:#3d1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172020; --surface-2:#1f2a29; --line:#2c3836;
  --ink:#e8eeec; --ink-2:#b2bdb9; --ink-3:#7f8b87;
  --brand:#3fb39c; --brand-ink:#06201a; --brand-soft:#173a33;
  --tag:#f3c536; --tag-ink:#2a2105; --tag-soft:#3a3214;
  --ok:#5cc47c; --warn:#e2a24a; --bad:#ef7a66; --ok-soft:#183324; --warn-soft:#3a2c14; --bad-soft:#3d1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){body{padding-bottom:0}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,46px);font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo .mark svg{width:18px;height:18px;stroke:var(--brand-ink)}
.logo b{color:var(--brand)}
.topsearch{flex:1;max-width:460px;display:none}
.topnav{display:none;gap:4px;align-items:center}
.topnav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500;position:relative}
.topnav a.on,.topnav a:hover{color:var(--ink);background:var(--surface-2)}
@media(min-width:900px){.topsearch{display:block}.topnav{display:flex}}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:none;padding:4px 0;position:relative}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--brand)}
.tabs a.pub span.ic{background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:3px 10px;display:grid;place-items:center}
.tabs .dot{right:calc(50% - 20px)}
@media(min-width:900px){.tabs{display:none}}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.tag{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea.input{min-height:110px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3)}
.searchbox .input{padding-left:38px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--brand-soft);color:var(--brand)} .pill.tag{background:var(--tag);color:var(--tag-ink)} .pill.grey{background:var(--surface-2);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px} @media(min-width:640px){.pad{padding:20px}}
.section{padding-block:28px;display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.sechead .spacer{min-width:8px}

/* Hero */
.hero{background:var(--ink);color:var(--bg)}
.hero .wrap{padding-block:36px 40px;display:grid;gap:24px}
.hero h1{color:var(--bg);max-width:16ch}
.hero h1 em{font-style:normal;color:var(--tag)}
.hero p{color:color-mix(in srgb,var(--bg) 75%,transparent);max-width:52ch}
.herosearch{display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface);padding:8px;border-radius:14px;max-width:760px;color:var(--ink)}
@media(min-width:700px){.herosearch{grid-template-columns:1.6fr 1fr auto}}
.herosearch .input{border-color:transparent;background:var(--surface-2)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--f-display);font-size:24px;color:var(--bg)}
.stats div span{font-size:13px;color:color-mix(in srgb,var(--bg) 65%,transparent)}

/* Categories */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.cats{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1000px){.cats{grid-template-columns:repeat(9,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:center;font-size:13px;font-weight:600;color:var(--ink)}
.cat:hover{border-color:var(--brand)}
.cat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.cat .ico svg{width:26px;height:26px}

/* Listing cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(min-width:1100px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s;min-width:0}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.item.boosted{border-color:var(--tag);box-shadow:0 0 0 1px var(--tag)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg.big{width:38%;height:38%;opacity:.9}
.ph .badge{position:absolute;top:8px;left:8px}
.ph .dist{position:absolute;bottom:8px;right:8px;background:rgba(10,16,15,.72);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.item .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .price{font-family:var(--f-display);font-weight:800;font-size:19px}
.item .price small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-3)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start}
@media(min-width:1000px){.hscroll{grid-auto-columns:calc((100% - 36px)/4)}}

/* Search layout */
.searchlayout{display:grid;gap:20px;padding-block:20px}
@media(min-width:900px){.searchlayout{grid-template-columns:280px minmax(0,1fr);align-items:start}}
.filters{display:flex;flex-direction:column;gap:16px}
@media(min-width:900px){.filters{position:sticky;top:84px}}
.filters details summary{cursor:pointer;font-weight:600}
.range2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapbox{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.mapbox svg{width:100%;height:100%;display:block}
.mapbox .pin{cursor:pointer}

/* Detail */
.detail{display:grid;gap:24px;padding-block:20px}
@media(min-width:900px){.detail{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);align-items:start}}
.gallery .main{border-radius:var(--r);overflow:hidden}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.thumbs button{width:72px;height:54px;padding:0;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex:none;background:var(--surface-2)}
.thumbs button.on{border-color:var(--brand)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.bookbox{position:relative}
@media(min-width:900px){.bookbox{position:sticky;top:84px}}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.sum .tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.owner{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:16px}
.av.sm{width:32px;height:32px;font-size:13px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.spec{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.spec b{display:block;font-size:16px}

/* Calendar */
.cal{user-select:none}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.cal .gridc{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:13px}
.cal .dow{font-size:11px;color:var(--ink-3);font-weight:600;padding:4px 0}
.cal .d{padding:7px 0;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums;border:1px solid transparent}
.cal .d:hover{border-color:var(--brand)}
.cal .d.past{color:var(--ink-3);opacity:.45;cursor:default;border-color:transparent}
.cal .d.blk{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.cal .d.bkd{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.cal .d.sel{background:var(--brand);color:var(--brand-ink);font-weight:700}
.cal .d.mid{background:var(--brand-soft);color:var(--ink)}
.cal .d.empty{cursor:default;border-color:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Packs */
.packs{display:grid;gap:12px}
@media(min-width:760px){.packs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pack.free{cursor:default;background:var(--surface-2)}
.pack{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.pack.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.pack .pp{font-family:var(--f-display);font-weight:800;font-size:28px}
.pack ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.pack .ribbon{position:absolute;top:-10px;right:14px}

/* Tables / lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
@media(max-width:640px){.li .acts{width:100%;padding-left:84px;flex-wrap:wrap}}
.li .th{width:72px;height:54px;border-radius:8px;overflow:hidden;flex:none}
.li .th .ph{aspect-ratio:auto;height:100%}
.li .grow{flex:1;min-width:0}
.li .grow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}

/* Messages */
.msglayout{display:grid;gap:16px;padding-block:20px}
@media(min-width:900px){.msglayout{grid-template-columns:320px minmax(0,1fr)}}
.thread{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;cursor:pointer;min-width:0}
.thread:hover,.thread.on{background:var(--surface-2)}
.chat{display:flex;flex-direction:column;height:min(70vh,640px)}
.chat .log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:16px}
.bub{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--surface-2);font-size:14px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.bub.sys{align-self:center;background:transparent;color:var(--ink-3);font-size:12px;text-align:center}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

/* Steps */
.how{display:grid;gap:12px}
@media(min-width:760px){.how{grid-template-columns:repeat(4,1fr)}}
.how .card{padding:16px;display:flex;flex-direction:column;gap:6px}
.how .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--brand)}
.split{display:grid;gap:20px}
@media(min-width:900px){.split{grid-template-columns:1fr 1fr;align-items:center}}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,12,11,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:700px){.modal{border-radius:18px;padding:24px}}
.modal.narrow{max-width:440px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media(min-width:900px){.toast{bottom:24px}}
.demo{background:var(--tag-soft);color:var(--ink);font-size:13px}
.demo .wrap{padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.drop{width:96px;height:72px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink-3);font-size:12px;text-align:center}
.formgrid{display:grid;gap:14px}
@media(min-width:700px){.formgrid.two{grid-template-columns:1fr 1fr}.formgrid.three{grid-template-columns:1fr 1fr 1fr}}
.stars{color:var(--tag);letter-spacing:1px}
.starpick button{background:none;border:0;font-size:26px;cursor:pointer;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--tag)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.footer{border-top:1px solid var(--line);margin-top:24px}
.footer .wrap{padding-block:24px;display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
/* ============ Config de negocio ============ */
const FEE_RATE = 0;             // sin comisiones: el único ingreso son los packs
const PACKS = [
  {id:"basico", name:"Destacado 24 h", price:1.99, hours:24, rank:1,
   perks:["Etiqueta «Destacado» en el anuncio","Sube al principio de tu categoría durante 24 h","Ideal para un fin de semana"]},
  {id:"pro", name:"Pro 7 días", price:6.99, hours:24*7, rank:2, popular:true,
   perks:["Top de las búsquedas durante 7 días","Aparece en «Destacados cerca de ti» en la portada","Etiqueta «Destacado»","Unas 5× más visitas de media"]},
  {id:"premium", name:"Premium 30 días", price:19.99, hours:24*30, rank:3,
   perks:["Todo lo del Pro durante 30 días","Sello «Propietario destacado» en tu perfil","Prioridad en el mapa y en la búsqueda local","Informe semanal de visitas"]}

  if(UI.fstart&&UI.fend&&UI.fend>=UI.fstart)r=r.filter(i=>rangeFree(i,UI.fstart,UI.fend));
  const dist=i=>km(L,i.loc);
  const sorts={relevancia:(a,b)=>boostRank(b)-boostRank(a)||dist(a)-dist(b),cerca:(a,b)=>boostRank(b)-boostRank(a)||dist(a)-dist(b),barato:(a,b)=>boostRank(b)-boostRank(a)||a.priceDay-b.priceDay,nuevo:(a,b)=>boostRank(b)-boostRank(a)||b.created-a.created};
  return r.sort(sorts[UI.fsort]||sorts.relevancia);
}

function mapHTML(r,L){
  const maxD=Math.max(2,...r.map(i=>km(L,i.loc)))*1.15;
  const kmLat=111, kmLng=111*Math.cos(L[0]*Math.PI/180);
  const W=400,H=300,sc=Math.min(W,H)/2/maxD;
  const pt=i=>[W/2+(i.loc[1]-L[1])*kmLng*sc, H/2-(i.loc[0]-L[0])*kmLat*sc];
  const rings=[maxD/3,2*maxD/3,maxD].map(d=>`<circle cx="${W/2}" cy="${H/2}" r="${d*sc}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${W/2+4}" y="${H/2-d*sc+12}" font-size="9" fill="var(--ink-3)">${fmtKm(d)}</text>`).join("");
  const pins=r.map(i=>{const [x,y]=pt(i);const b=boostActive(i);return `<g class="pin" data-act="open" data-id="${i.id}"><title>${esc(i.title)} · ${eur(i.priceDay)}/día</title><rect x="${x-20}" y="${y-22}" width="40" height="17" rx="8" fill="${b?"var(--tag)":"var(--surface)"}" stroke="${b?"var(--tag)":"var(--ink-3)"}"/><text x="${x}" y="${y-10}" text-anchor="middle" font-size="10" font-weight="700" fill="${b?"var(--tag-ink)":"var(--ink)"}">${Math.round(i.priceDay)} €</text><circle cx="${x}" cy="${y}" r="3" fill="var(--brand)"/></g>`}).join("");
  return `<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de resultados">${rings}<circle cx="${W/2}" cy="${H/2}" r="6" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>${pins}</svg></div><p class="tiny">Mapa esquemático centrado en ${esc(S.myCity)}. Toca un precio para ver el anuncio. En la versión de producción se usa un mapa real.</p>`;
}

function calHTML(it,mode){
  const base=addDays(today(),0);const first=new Date(base.getFullYear(),base.getMonth()+UI.calM,1);
  const busy=mode==="edit"?new Set():busyDates(it);const blk=new Set(mode==="edit"?(UI.draft.blocked||[]):(it.blocked||[]));
  const startDow=(first.getDay()+6)%7;const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  let cells="";for(let i=0;i<startDow;i++)cells+=`<span class="d empty"></span>`;
  const T=iso(today());
  for(let d=1;d<=dim;d++){const ds=iso(new Date(first.getFullYear(),first.getMonth(),d));let cls="d";
    if(ds<T)cls+=" past";else if(blk.has(ds))cls+=" blk";else if(busy.has(ds))cls+=" bkd";
    if(mode!=="edit"&&UI.selS){if(ds===UI.selS||ds===UI.selE)cls+=" sel";else if(UI.selE&&ds>UI.selS&&ds<UI.selE)cls+=" mid"}
    cells+=`<span class="${cls}" data-act="${mode==="edit"?"toggleblk":"pickday"}" data-id="${ds}" role="button" tabindex="0">${d}</span>`}
  let title=first.toLocaleDateString("es-ES",{month:"long",year:"numeric"});title=title.charAt(0).toUpperCase()+title.slice(1);
  return `<div class="cal"><div class="hd"><button class="btn sm ghost" data-act="calprev" ${UI.calM<=0?"disabled":""} aria-label="Mes anterior">‹</button><span>${title}</span><button class="btn sm ghost" data-act="calnext" aria-label="Mes siguiente">›</button></div>
  <div class="gridc">${["L","M","X","J","V","S","D"].map(x=>`<span class="dow">${x}</span>`).join("")}${cells}</div>
  <div class="legend" style="margin-top:8px">${mode==="edit"?`<span><i style="background:var(--surface-2)"></i>Bloqueado por ti</span><span>Toca un día para bloquearlo o liberarlo</span>`:`<span><i style="background:var(--brand)"></i>Tu selección</span><span><i style="background:var(--bad-soft)"></i>Reservado</span><span><i style="background:var(--surface-2)"></i>No disponible</span>`}</div></div>`;
}

function popularLinks(n){const out=[];CATS.forEach(c=>Object.keys(CITIES).forEach(ci=>{const k=landingItems(c.id,ci).length;if(k)out.push([k,c,ci])}));return out.sort((a,b)=>b[0]-a[0]).slice(0,n).map(([k,c,ci])=>`<a class="chip" href="${landingHref(c.id,ci)}">${esc(c.n)} en ${esc(ci)}</a>`).join("")}
function vLanding(param){
  const [catId,city]=param.split("|");const c=cat(catId);const L=CITIES[city];
  const its=landingItems(catId,city).sort((a,b)=>boostRank(b)-boostRank(a)||km(L,a.loc)-km(L,b.loc));
  const nm=c.n.toLowerCase();
  const prices=its.map(i=>i.priceDay);const minP=prices.length?Math.min(...prices):0;const avg=prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:0;
  const title=`Alquiler de ${nm} en ${city} desde ${minP?eur(minP):"pocos euros"} al día | Alquilaap`;
  const desc=`${its.length||"Nuevos"} anuncios de ${nm} para alquilar en ${city} entre particulares y tiendas. Sin comisiones: pagas directamente al propietario. Reserva por días o semanas.`;
  const others=Object.keys(CITIES).filter(ci=>ci!==city&&landingItems(catId,ci).length).slice(0,6);
  const otherCats=CATS.filter(x=>x.id!==catId&&landingItems(x.id,city).length);
  return `<div class="wrap section">
    <div class="tiny"><a href="#inicio">Inicio</a> › <a href="#buscar" data-act="gocat" data-id="${c.id}">${esc(c.n)}</a> › ${esc(city)}</div>

    <p class="muted" style="max-width:65ch">${its.length?`Hay ${its.length} ${its.length===1?"anuncio":"anuncios"} de ${esc(nm)} en ${esc(city)} y alrededores, desde ${eur(minP)} al día (media ${eur(Math.round(avg))}).`:`Todavía no hay ${esc(nm)} en ${esc(city)}. Publica el tuyo gratis y sé el primero.`} Publicar es gratis y no cobramos comisión por alquilar.</p>
    ${its.length?`<div class="grid g4">${its.map(card).join("")}</div>`:`<div><a class="btn primary" href="#publicar">Publicar gratis</a></div>`}

/* ============ Router ============ */
function route(){
  const h=(location.hash||"#inicio").slice(1);
  let v=h,p=null;
  const m=h.match(/^(anuncio|editar)-(.+)$/);if(m){v=m[1];p=m[2]}
  if(h==="negocio-packs"){v="negocio";p="packs"}
  const lm=h.match(/^alquilar-([a-z]+)-(.+)$/);if(lm&&CATS.some(c=>c.id===lm[1])&&cityFromSlug(lm[2])){v="landing";p=lm[1]+"|"+cityFromSlug(lm[2])}
  if(!["inicio","buscar","anuncio","editar","publicar","mis-anuncios","reservas","mensajes","perfil","negocio","landing"].includes(v))v="inicio";
  if(v!==UI.view||p!==UI.param){
    if(v==="anuncio"&&p!==UI.param){UI.selS="";UI.selE="";UI.photoIx=0;UI.calM=0;const it=item(p);if(it&&it.ownerId!==S.me){it.views++;save()}}
    if(v==="publicar"&&UI.view!=="publicar"){UI.draft=null;UI.aiMsg=""}
    UI.view=v;UI.param=p;window.scrollTo(0,0);
  }
  render();
  if(p==="packs"){const el=document.getElementById("packs");if(el)el.scrollIntoView()}
}
function render(){
  const views={landing:()=>vLanding(UI.param),inicio:vInicio,buscar:vBuscar,anuncio:()=>vAnuncio(UI.param),editar:()=>vPublicar(UI.param),publicar:()=>vPublicar(null),"mis-anuncios":vMisAnuncios,reservas:vReservas,mensajes:vMensajes,perfil:vPerfil,negocio:vNegocio};
  const active=document.activeElement&&document.activeElement.id, selStart=active&&document.activeElement.selectionStart;
  $("#app").innerHTML=shell((views[UI.view]||vInicio)());
  if(active){const el=document.getElementById(active);if(el&&el.tagName!=="BUTTON"){el.focus();try{if(selStart!=null)el.setSelectionRange(selStart,selStart)}catch(e){}}}
  const log=$("#log");if(log)log.scrollTop=log.scrollHeight;
  const pi=$("#photoin");if(pi)pi.addEventListener("change",onPhotos);
  const mb=document.querySelector(".msgback");if(mb&&window.innerWidth>=900)mb.hidden=true;
}
let tt;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2800)}
const go=h=>{if(location.hash==="#"+h)route();else location.hash=h};
function sysMsg(b,text){S.messages.push({id:uid("m"),thread:threadKey(b.itemId,b.renterId),from:"sys",text,at:Date.now()})}

/* ============ Fotos ============ */
function onPhotos(e){
  const files=[...e.target.files].slice(0,6-UI.draft.photos.length);let left=files.length;
  files.forEach(f=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);UI.draft.photos.push(c.toDataURL("image/jpeg",.72));if(--left===0)render()};img.onerror=()=>{if(--left===0)render()};img.src=r.result};r.readAsDataURL(f)});
}

/* ============ IA: rellenar anuncio desde la foto ============ */
function dataUrlToBlob(u){const [h,b]=u.split(",");const mime=(h.match(/:(.*?);/)||[,"image/jpeg"])[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
async function aiFill(){
  const d=UI.draft;if(!SAMPLE||!d||!d.photos.length)return;
  UI.aiBusy=true;UI.aiMsg="Analizando la foto…";render();
  const prompt=`Eres el asistente de publicación de Alquilaap, un marketplace español de alquiler de objetos entre particulares.
Mira la foto y prepara el anuncio de alquiler del objeto principal. Responde SOLO con un objeto JSON con estas claves:
"title": título en español, máximo 60 caracteres, con marca y modelo si se ven;
"cat": exactamente uno de ${CATS.map(c=>'"'+c.id+'"').join(", ")};
"desc": descripción en español de 2 o 3 frases: qué es, estado aparente, para qué sirve y qué conviene incluir;
"priceDay": precio razonable por día en euros (número) para alquiler entre particulares en ${d.city||"España"};
"priceWeek": precio por semana en euros (número, menor que 7 veces el diario);
"deposit": fianza razonable en euros (número, múltiplo de 10).`;
  try{
    const r=await SAMPLE.json(prompt,{images:[dataUrlToBlob(d.photos[0])],modelTier:"default"});
    if(r&&typeof r==="object"){
      if(r.title)d.title=String(r.title).slice(0,70);
      if(CATS.some(c=>c.id===r.cat))d.cat=r.cat;
      if(r.desc)d.desc=String(r.desc);
      if(+r.priceDay>0)d.priceDay=Math.round(+r.priceDay*2)/2;
      if(+r.priceWeek>0)d.priceWeek=Math.round(+r.priceWeek);
      if(+r.deposit>=0)d.deposit=Math.round(+r.deposit);
      UI.aiMsg="Listo. Revisa los datos y cambia lo que quieras antes de publicar.";
    }else UI.aiMsg="No he podido leer la respuesta. Prueba otra vez o rellénalo a mano.";
  }catch(e){
    if(e&&e.code==="not_granted"){SAMPLE=null;UI.aiMsg=""}
    else if(e&&e.code==="rate_limited")UI.aiMsg="Demasiadas peticiones seguidas. Espera un momento y vuelve a probar.";
    else UI.aiMsg="La IA no ha podido analizar la foto. Rellénalo a mano o prueba con otra foto.";
  }
  UI.aiBusy=false;render();
}
(async()=>{try{if(window.claude&&typeof window.claude.use==="function"){const s=await window.claude.use("sample");if(s){SAMPLE=s;if(UI.view==="publicar"||UI.view==="editar")render()}}}catch(e){}})();

    case "logout":S.me=null;save();go("inicio");break;
    case "rmphoto":UI.draft.photos.splice(+id,1);render();break;
    case "pause":{const it=item(id);it.active=!it.active;save();toast(it.active?"Anuncio reactivado":"Anuncio pausado");UI.draft=null;go("mis-anuncios");break}
    case "gopro":UI.modal={type:"pro"};render();break;
    case "aifill":aiFill();break;
    case "reset":UI.modal={type:"confirm",title:"Restablecer la demo",text:"Se borran tus cambios y vuelven los datos de ejemplo.",ok:"Restablecer",run:()=>{S=seed();save();UI.draft=null;go("inicio")}};render();break;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}if(e.key==="Escape"&&UI.modal){UI.modal=null;render()}});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-act]");if(!f)return;e.preventDefault();const a=f.dataset.act;
  if(a==="topsearch"){UI.q=$("#topq").value;go("buscar")}
  if(a==="herosearch"){UI.q=$("#heroq").value;S.myCity=$("#herocity").value;save();go("buscar")}
  if(a==="send"){const v=$("#msgin").value.trim();if(!v)return;S.messages.push({id:uid("m"),thread:UI.thread,from:S.me,text:v,at:Date.now()});save();render();const i=$("#msgin");if(i)i.focus()}
  if(a==="saveitem"){const d=UI.draft;if(!d.title||!d.desc||!d.priceDay){toast("Completa título, descripción y precio");return}
    const loc=CITIES[d.city]||CITIES.Barcelona;const data={title:d.title.trim(),desc:d.desc.trim(),cat:d.cat,priceDay:+d.priceDay,priceWeek:d.priceWeek?+d.priceWeek:0,deposit:+d.deposit||0,city:d.city,cp:d.cp,photos:d.photos,blocked:d.blocked};
    if(d._for==="new"){const it=Object.assign({id:uid("i"),ownerId:S.me,loc:[loc[0]+(Math.random()-.5)*.03,loc[1]+(Math.random()-.5)*.04],created:Date.now(),views:0,boost:null,active:true,rating:5,reviews:0},data);S.items.unshift(it);if(save()){UI.draft=null;toast("¡Publicado! Tu anuncio ya está visible.");UI.modal={type:"boost",id:it.id,pack:"basico",step:"pick"};go("anuncio-"+it.id)}else S.items.shift()}
    else{const it=item(d._for);if(it.city!==d.city)it.loc=[loc[0]+(Math.random()-.5)*.03,loc[1]+(Math.random()-.5)*.04];Object.assign(it,data);save();UI.draft=null;toast("Cambios guardados");go("anuncio-"+it.id)}}
  if(a==="paypro"){const u=me();u.pro=Math.max(Date.now(),u.pro||0)+30*24*36e5;S.subs.push({id:uid("s"),userId:u.id,amount:PRO.price,at:Date.now()});save();UI.modal=null;toast("¡Ya eres Pro! Tus anuncios salen por delante.");render()}
  if(a==="paypack"){const m=UI.modal,p=PACKS.find(x=>x.id===m.pack),it=item(m.id);const base=boostActive(it)&&it.boost.pack===p.id?it.boost.until:Date.now();it.boost={pack:p.id,until:base+p.hours*36e5};S.purchases.push({id:uid("p"),itemId:it.id,userId:S.me,pack:p.id,amount:p.price,at:Date.now()});save();UI.modal=null;toast(`${p.name} activado. ¡Tu anuncio ya sale primero!`);render()}
  if(a==="savereview"){const m=UI.modal,b=S.bookings.find(x=>x.id===m.id);const role=UI.resTab==="inquilino"?"renter":"owner";b.reviews[role]={stars:m.stars,text:$("#revtxt").value.trim(),at:Date.now()};if(role==="renter"){const it=item(b.itemId);it.reviews++;it.rating=Math.round(((it.rating*(it.reviews-1))+m.stars)/it.reviews*10)/10}save();UI.modal=null;toast("Gracias por tu valoración");render()}
  if(a==="dokyc"){const u=me();const dni=$("#k_dni").value.trim().toUpperCase();u.legalName=$("#k_name").value.trim();u.kyc={dni:dni.slice(0,1)+"•••••"+dni.slice(-3),at:Date.now()};u.verified.phone=true;u.verified.dni=true;save();UI.modal=null;toast("Identidad verificada. Ya puedes alquilar y publicar.");render()}
  if(a==="doissue"){const b=S.bookings.find(x=>x.id===UI.modal.id);b.status="incidencia";b.issue=$("#iss_type").value+": "+$("#iss_txt").value.trim();sysMsg(b,`Incidencia abierta por ${me().name}: ${b.issue}`);if(b.insurance)sysMsg(b,"Este alquiler tiene seguro: el parte se ha enviado a la aseguradora.");save();UI.modal=null;toast("Incidencia abierta");render()}
  if(a==="doverify"){me().verified[UI.modal.id]=true;save();UI.modal=null;toast("Verificación completada");render()}
  if(a==="emaillogin"){const name=$("#lname").value.trim()||"Nuevo usuario";const u={id:uid("u"),name,city:S.myCity,color:"#"+["0f6b5c","2f6fb0","b2582b","7a4bb0","b23a6a"][Math.floor(Math.random()*5)],joined:String(new Date().getFullYear()),verified:{email:true,phone:false,dni:false},bio:""};S.users.push(u);S.me=u.id;save();toast("Cuenta creada. ¡Bienvenido, "+name+"!");route()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f){const k=t.dataset.f;if(k==="city"){S.myCity=t.value;save()}else UI[k]=t.value;
    clearTimeout(window.__ft);window.__ft=setTimeout(render,t.type==="text"||t.type==="search"||!t.type||t.type==="number"?250:0);}
  if(t.dataset.d){UI.draft[t.dataset.d]=t.value}
  if(t.dataset.act==="seldate"){UI.selS=$("#selS").value;UI.selE=$("#selE").value;if(UI.selE&&UI.selE<UI.selS)UI.selE="";render()}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.act==="ins"){UI.ins=t.checked;render();return}if(t.dataset.f&&t.tagName==="SELECT")render()});
window.addEventListener("hashchange",route);
let lastW=window.innerWidth;window.addEventListener("resize",()=>{if((lastW<900)!==(window.innerWidth<900)){lastW=window.innerWidth;render()}});
route();
})();
</script>

</html>
